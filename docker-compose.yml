# ============================================================
# Bifrost Route · Layer 1 local infrastructure
#   MySQL 8          → routing_policies, budget_limits, model_registry
#   Redis Stack      → semantic cache (RediSearch vector KNN + LRU eviction)
#   DynamoDB Local   → query_traces (traces table, GSIs, on-demand)
# Run:  docker compose up -d
# ============================================================

services:
  mysql:
    image: mysql:8.4
    container_name: bifrost-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: bifrost_dev_password
      MYSQL_DATABASE: bifrost_route
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Applied automatically on first boot; setup scripts re-apply idempotently.
      - ./infra/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pbifrost_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis/redis-stack-server:latest   # includes RediSearch (vector KNN)
    container_name: bifrost-redis
    restart: unless-stopped
    ports:
      - "6380:6379"   # host 6380 → container 6379 (avoids clash with existing local Redis)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: bifrost-dynamodb
    restart: unless-stopped
    # Image JVM runs as non-root `dynamodblocal` and cannot write the named
    # volume; run as root (documented fix for volume-mounted databases).
    user: root
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    command:
      - -jar
      - DynamoDBLocal.jar
      - -sharedDb
      - -dbPath
      - /home/dynamodblocal/data

  # ── Layer 2 (Retrieval) ────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: bifrost-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/bifrost_neo4j_pw
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p bifrost_neo4j_pw 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bifrost-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # http
      - "6334:6334"   # grpc
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  redis_data:
  dynamodb_data:
  neo4j_data:
  qdrant_data: